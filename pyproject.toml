[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-to-text-interrogator"
version = "0.0.1"
description = "Vision-LLM-driven image interrogation: turn an image into a faithful, detailed text-to-image prompt, with bundled presets, pluggable providers (ollama, OpenAI-compatible, WaveSpeed, Anthropic, Claude Code), library API and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wujidadi" }]
keywords = ["prompt", "image-to-text", "interrogator", "vision", "llm", "ollama", "stable-diffusion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Wujidadi/image-to-text-interrogator"

[project.scripts]
image-interrogator = "image_interrogator.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/image_interrogator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["image_interrogator"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
